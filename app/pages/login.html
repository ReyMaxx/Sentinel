<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel — Iniciar sesión</title>
    <link rel="stylesheet" href="./../public/style-login.css">
    <script src="./../public/login.js" defer></script>
    <link href="https://cdn.prod.website-files.com/644a3c274c8132e01fddc86e/6454e839683617f0c2edc791_favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>
<body>
    <div class="bg-grid"></div>
<div class="bg-glow"></div>

<div class="bg-blobs">
  <span></span>
  <span></span>
  <span></span>
</div>

  <div class="container">
    <h1>Iniciar sesión</h1>

    <form id="login-form">
      <div class="form-group">
        <label for="user">Usuario</label>
        <input type="text" id="user" name="user" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>

      <button type="submit">Entrar</button>
    </form>

    <!-- Mensaje de error -->
    <div class="error-message" id="error-message" style="display: none;">
      Usuario o contraseña incorrectos
    </div>

    <div class="footer">
      ¿No tienes cuenta? <a href="/register">Regístrate</a>
    </div>
  </div>
</body>
</html>
