<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentinel — Crear cuenta</title>
    
    <link rel="stylesheet" href="./../public/style-register.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #0b0b12; /* Color base oscuro idéntico para evitar fondo blanco */
            display: flex;       /* Centrado Flexbox inmediato */
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
    </style>

    <script src="./../public/register.js" defer></script>
    <link href="https://cdn.prod.website-files.com/644a3c274c8132e01fddc86e/6454e839683617f0c2edc791_favicon.ico" rel="shortcut icon" type="image/x-icon">
</head>
<body>

  <div class="bg-grid"></div>
  <div class="bg-glow"></div>

  <div class="bg-blobs">
    <span></span>
    <span></span>
    <span></span>
  </div>
    
  <div class="container">
    <h1>Registrarse</h1>

    <form id="register-form">
      <div class="form-group">
        <label for="user">Usuario</label>
        <input type="text" id="user" name="user" required>
      </div>

      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required>
      </div>

      <div class="form-group">
        <label for="confirm-password">Confirmar contraseña</label>
        <input type="password" id="confirm-password" name="confirm-password" required>
      </div>

      <button type="submit">Registrarse</button>
    </form>

    <div class="error-message" id="error-message" style="display: none;">
      Las contraseñas no coinciden
    </div>

    <div class="success-message hide" id="success-message">
      Cuenta creada correctamente
    </div>

    <div class="footer">
      ¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a>
    </div>
  </div>
</body>
</html>
